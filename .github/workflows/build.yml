name: Build MyMusic APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install and build
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev
        sudo apt-get install -y python3-pip build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf libtool pkg-config cmake libffi-dev libssl-dev openjdk-17-jdk unzip zip
        pip install --upgrade pip
        pip install buildozer cython==0.29.33
        buildozer -v android debug
    - uses: actions/upload-artifact@v4
      with:
        name: MyMusic-APK
        path: bin/*.apk
        retention-days: 30
