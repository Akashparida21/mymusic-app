name: Build MyMusic APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libunwind-dev \
          libffi-dev \
          libssl-dev \
          libreadline-dev \
          libncurses-dev \
          libz-dev \
          libbz2-dev \
          liblzma-dev \
          libsqlite3-dev \
          libgdbm-dev \
          tk-dev \
          uuid-dev \
          libglu1-mesa-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          libjpeg-dev \
          libpng-dev \
          libfreetype6-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config
    - name: Setup Python and build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.33
    - name: Build APK
      run: |
        buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyMusic-APK
        path: bin/*.apk
        retention-days: 30
